<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Arquivos - Org.Auto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Card Central com Efeito de Vidro Fosco -->
  <div class="glass-card">
    <h1>Org.Auto</h1>
    <p>Selecione seus arquivos para organizá-los automaticamente nas pastas corretas.</p>
    
    <button id="open-file-dialog">Selecionar Arquivos</button>
    <input type="file" id="file-input" multiple style="display: none;" accept=".pdf,.png,.jpg,.jpeg">
  </div>

  <!-- Fundo Animado (Vanta.js) -->
  <div id="vanta-bg"></div>

  <!-- Scripts do Vanta.js e Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    VANTA.NET({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x3f55ff,
      backgroundColor: 0x071228,
      points: 17.00,
      maxDistance: 25.00,
      spacing: 16.00
    });
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
